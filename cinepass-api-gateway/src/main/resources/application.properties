server.port=8080
spring.application.name=API-GATEWAY

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Routes (Eureka service discovery and client-side load balancing)
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=lb://CINEPASS-USER-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=movie-service
spring.cloud.gateway.routes[1].uri=lb://CINEPASS-MOVIE-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/movies/**

spring.cloud.gateway.routes[2].id=show-service
spring.cloud.gateway.routes[2].uri=lb://CINEPASS-SHOW-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/shows/**

spring.cloud.gateway.routes[3].id=booking-service
spring.cloud.gateway.routes[3].uri=lb://CINEPASS-BOOKING-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bookings/**

# Global CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*

jwt.secret=cinepassSuperSecretKeyForJwtAuthenticationAcademicDemoOnly1234567890
